[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netscope"
version = "0.1.1"
description = "HTTP diagnostics: per-stage timings, header checks, Prometheus metrics."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
netscope = "netscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
