apiVersion: apps/v1
kind: Deployment
metadata:
  name: netscope
  namespace: netscope
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netscope
  template:
    metadata:
      labels:
        app: netscope
    spec:
      enableServiceLinks: false 
      containers:
        - name: netscope
          image: ghcr.io/shail-xx/netscope:0.1.0
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: netscope-config
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault